global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: order-consumer
    static_configs:
      - targets: ["order-consumer:8082"]
  - job_name: outbox-publisher
    static_configs:
      - targets: ["outbox-publisher:8084"]
  - job_name: rank-consumer
    static_configs:
      - targets: ["rank-consumer:8083"]
